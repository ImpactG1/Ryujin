version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ryujin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ryujin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ryujin_password}
      POSTGRES_DB: ${POSTGRES_DB:-ryujin_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryujin -d ryujin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryujin_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ryujin:ryujin_password@postgres:5432/ryujin_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ryujin_bot
    restart: unless-stopped
    command: python -m bot.client
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ryujin:ryujin_password@postgres:5432/ryujin_db
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
    driver: local

